<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>보험 문의하기</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Malgun Gothic", sans-serif;
    background: #F4F6F8;
    color: #1B2430;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  .badge {
    color: #2563EB;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  h1 {
    margin: 8px 0 6px;
    font-size: 26px;
    font-weight: 800;
    line-height: 1.3;
  }
  p.desc {
    margin: 0 0 28px;
    color: #5B6472;
    font-size: 14px;
    line-height: 1.6;
  }
  form { display: flex; flex-direction: column; gap: 12px; }
  input, textarea {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid #DDE2E8;
    background: #fff;
    font-size: 15px;
    font-family: inherit;
    color: #1B2430;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: #2563EB;
  }
  textarea { min-height: 110px; resize: vertical; }
  button {
    margin-top: 6px;
    padding: 16px;
    border: none;
    border-radius: 999px;
    background: #2563EB;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  .error { color: #DC2626; font-size: 13px; font-weight: 600; margin: 0; }
  .success {
    text-align: center;
    padding: 40px 0;
  }
  .success .icon {
    width: 56px; height: 56px; border-radius: 999px;
    background: #2563EB; color: #fff;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px; font-size: 26px; font-weight: 800;
  }
  .success h2 { font-size: 20px; margin: 0 0 10px; }
  .success p { color: #5B6472; font-size: 14px; line-height: 1.6; }
  .hidden { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <div id="formView">
      <span class="badge">Insurance Consulting</span>
      <h1>보험 문의하기</h1>
      <p class="desc">이름, 연락처와 궁금하신 내용을 남겨주시면<br />빠르게 확인 후 연락드리겠습니다.</p>
      <form id="inquiryForm">
        <input type="text" id="name" placeholder="이름" required />
        <input type="tel" id="contact" placeholder="연락처 (예: 010-0000-0000)" required />
        <textarea id="message" placeholder="문의 내용을 남겨주세요"></textarea>
        <p class="error hidden" id="errorMsg">이름과 연락처를 입력해 주세요.</p>
        <button type="submit">문의하기</button>
      </form>
    </div>
    <div id="successView" class="success hidden">
      <div class="icon">✓</div>
      <h2>문의가 접수되었습니다</h2>
      <p>빠른 시일 내로 연락드리겠습니다.</p>
    </div>
  </div>

<script>
  const NTFY_TOPIC = "insurance-inquiry-l6z02325";
  const form = document.getElementById("inquiryForm");
  const errorMsg = document.getElementById("errorMsg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const contact = document.getElementById("contact").value.trim();
    const message = document.getElementById("message").value.trim();

    if (!name || !contact) {
      errorMsg.classList.remove("hidden");
      return;
    }
    errorMsg.classList.add("hidden");

    try {
      await fetch(`https://ntfy.sh/`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          topic: NTFY_TOPIC,
          title: "보험 블로그 문의",
          priority: 4,
          tags: ["bell"],
          message:
            `보험 블로그에서 새 문의가 들어왔어요!\n` +
            `이름: ${name}\n` +
            `연락처: ${contact}\n` +
            `문의 내용: ${message || "(내용 없음)"}`
        })
      });
    } catch (err) {
      console.error("알림 전송 실패:", err);
    }

    document.getElementById("formView").classList.add("hidden");
    document.getElementById("successView").classList.remove("hidden");
  });
</script>
</body>
</html>
